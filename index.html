<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Financeiro Responsivo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header><h1>Painel Financeiro</h1></header>

<!-- Abas -->
<div class="tabs">
  <ul class="nav nav-tabs justify-content-center" id="tabs">
    <li class="nav-item"><button class="nav-link active" onclick="showTab('lancamentos')">Lançamentos</button></li>
    <li class="nav-item"><button class="nav-link" onclick="showTab('relatorio')">Relatório</button></li>
  </ul>
</div>

<!-- Lançamentos -->
<div id="lancamentos" class="tab-content mt-3">
  <div class="card">
    <h5>Adicionar Receita/Despesa</h5>
    <div class="row g-2">
      <div class="col-12 col-md-3"><input type="date" id="data" class="form-control"></div>
      <div class="col-12 col-md-3">
        <select id="tipo" class="form-select">
          <option value="receita">Receita</option>
          <option value="despesa">Despesa</option>
        </select>
      </div>
      <div class="col-12 col-md-3">
        <input type="text" id="categoria" placeholder="Categoria" class="form-control">
      </div>
      <div class="col-12 col-md-2"><input type="number" id="valor" step="0.01" placeholder="Valor R$" class="form-control"></div>
      <div class="col-12 col-md-1 d-flex align-items-end"><button class="btn btn-success w-100" onclick="adicionarLancamento()">➕</button></div>
    </div>
  </div>

  <div class="cards mt-3">
    <div class="card"><h2>Receitas</h2><p id="totalReceitas">R$ 0,00</p></div>
    <div class="card"><h2>Despesas</h2><p id="totalDespesas">R$ 0,00</p></div>
    <div class="card"><h2>Saldo</h2><p id="saldo">R$ 0,00</p></div>
  </div>

  <div class="relatorio mt-3">
    <h5>Lançamentos Realizados</h5>
    <table>
      <thead>
        <tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Valor</th><th>Ação</th></tr>
      </thead>
      <tbody id="tabela"></tbody>
    </table>
  </div>
</div>

<!-- Relatório -->
<div id="relatorio" class="tab-content mt-3" style="display:none;">
  <div class="chart-container">
    <h5>Gráficos</h5>
    <canvas id="graficoPizza"></canvas>
    <canvas id="graficoLinha" class="mt-3"></canvas>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
