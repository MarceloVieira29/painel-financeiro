<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Financeiro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <button onclick="abrirAba('lancamentos')">Lançamentos</button>
    <button onclick="abrirAba('relatorios')">Relatórios</button>
    <button onclick="abrirAba('graficos')">Gráficos</button>
  </div>

  <div id="lancamentos" class="aba ativa">
    <h2>Lançamentos</h2>
    <form id="formLancamento">
      <input type="date" id="data" required>
      <input type="text" id="descricao" placeholder="Descrição" required>
      <input type="number" id="valor" placeholder="Valor" required>
      <select id="tipo">
        <option value="receita">Receita</option>
        <option value="despesa">Despesa</option>
      </select>
      <button type="submit">Adicionar</button>
    </form>
    <table id="tabelaLancamentos">
      <thead>
        <tr><th>Data</th><th>Descrição</th><th>Valor</th><th>Tipo</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="relatorios" class="aba">
    <h2>Relatórios</h2>
    <div id="resumo"></div>
  </div>

  <div id="graficos" class="aba">
    <h2>Gráficos</h2>
    <canvas id="grafico"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
